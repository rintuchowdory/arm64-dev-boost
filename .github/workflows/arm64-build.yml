name: ARM64 Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 base image
        run: docker build -t arm64-base ./docker/base-arm64

      - name: Build ARM64 node image
        run: docker build -t arm64-node ./docker/node-arm64

      - name: Verify ARM64
        run: docker run --rm arm64-node node -e "console.log(process.arch)"
